<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Say It Smoothly</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<style>
/* Layout concept: one point per screen on a crisp white stage. Every clause is a labeled block and every mark is a round butter chip, so the build of a sentence can be read from the back row. */
:root{
  --paper:#FFFFFF; --ink:#1E2230; --muted:#565C6E; --line:#DDDAE8; --soft:#F5F4FA; --focus:#2E5AAC;
  --actbg:#FFF1BF; --actink:#7A5A00;
  /* the color code. blue = complete thought, peach = waiting part, mint = joining word, lavender = transition word, butter = the marks */
  --c-bg:#D9E9FA; --c-ink:#1D4F7C;
  --w-bg:#FDE3D2; --w-ink:#8C4A1E;
  --j-bg:#D3F1E6; --j-ink:#14665B;
  --x-bg:#E7E2F6; --x-ink:#4A3B8F;
  --p-bg:#FFE68A; --p-ink:#1E2230; --p-edge:#7A5A00;
  --pink-bg:#FADCE6; --pink-ink:#8E2E55;
  --lexend:"Lexend","Avenir Next",Avenir,Verdana,Arial,sans-serif;
  --body:"Atkinson Hyperlegible","Avenir Next",Avenir,Verdana,Arial,sans-serif;
  --u:min(1vw,1.72vh);
  --t-ui:clamp(14px,calc(var(--u)*1.42),30px);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:var(--t-ui);line-height:1.5;letter-spacing:.01em;word-spacing:.05em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;letter-spacing:inherit;word-spacing:inherit}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;min-height:100%;padding-inline:clamp(16px,calc(var(--u)*2.6),64px);padding-block:clamp(8px,calc(var(--u)*.9),20px);gap:6px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px 14px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:.6em;padding:.45em 1.1em;border-radius:999px;background:var(--actbg);color:var(--actink);font-family:var(--lexend);font-weight:600;font-size:1em;white-space:nowrap;transition:background .4s,color .4s}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:.8em;padding:.42em .9em;cursor:pointer;font-family:var(--lexend);font-weight:600;font-size:.95em;display:inline-flex;align-items:center;gap:.45em;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--actink);border-color:var(--actink);color:#fff;transition:background .4s,border-color .4s}
.btn.primary:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.big{font-size:var(--t-sub);padding:.5em 1.1em;border-radius:.7em;border-width:3px}
:is(.btn,.choice,.opt,.gap,.mtile,.lvl,.pm,[contenteditable]):focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.team{display:inline-flex;align-items:center;gap:.4em;border:2px solid var(--line);border-radius:.8em;padding:.25em .4em .25em .7em}
.team .name{font-family:var(--lexend);font-weight:600;min-width:3ch;padding:2px 4px;border-radius:6px;font-size:.95em}
.team .pts{font-family:var(--lexend);font-weight:700;font-size:1.2em;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.team .pm{border:0;background:var(--soft);border-radius:.5em;width:1.9em;height:1.9em;cursor:pointer;font-weight:700;font-family:var(--lexend)}
.team .pm:hover{background:var(--line)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding-block:clamp(8px,calc(var(--u)*1.1),26px);min-height:0}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:14px;border-top:2px solid var(--line);padding-top:8px;flex-wrap:wrap}
.count{font-family:var(--lexend);font-weight:600;font-size:.92em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress{display:flex;gap:5px;flex:1 1 160px;max-width:min(52vw,900px);height:.7em}
.progress .seg{flex-grow:1;background:var(--soft);border-radius:999px;overflow:hidden;min-width:8px}
.progress .seg i{display:block;height:100%;width:0;border-radius:999px;transition:width .3s}
.nav{display:flex;gap:10px}
.pop{position:absolute;right:clamp(16px,calc(var(--u)*2.6),64px);top:calc(var(--t-ui)*3.4);background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 30px rgba(30,34,48,.14);display:flex;flex-direction:column;gap:12px;z-index:25;max-width:min(92vw,440px)}
.pop label{display:flex;flex-direction:column;gap:6px;font-family:var(--lexend);font-weight:600;font-size:.95em}
.pop select{font:inherit;padding:8px;border-radius:10px;border:2px solid var(--line);max-width:100%;background:var(--paper);color:var(--ink)}
.pop .seg2{display:flex;gap:8px;flex-wrap:wrap}
.pop .btn.on{background:var(--actbg);border-color:var(--actink);color:var(--actink)}
.pop .hint{color:var(--muted);font-size:.9em;margin:0}
.overlay{position:fixed;inset:0;background:rgba(30,34,48,.5);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.sheet{background:var(--paper);border-radius:24px;padding:clamp(16px,calc(var(--u)*2.2),40px);width:min(100%,calc(var(--u)*74));max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:clamp(8px,calc(var(--u)*1),18px)}
.sheet h2{font-family:var(--lexend);font-weight:700;font-size:clamp(22px,calc(var(--u)*3),56px);margin:0;line-height:1.15}
.sheet .sheethd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:.8em;align-items:center;width:100%;text-align:left;border:3px solid var(--line);background:var(--paper);border-radius:.8em;padding:.5em .8em;cursor:pointer;font-family:var(--lexend);font-weight:600;font-size:clamp(16px,calc(var(--u)*1.9),36px);line-height:1.2}
.lvl:hover{background:var(--soft)}
.lvl.here{border-color:var(--ink)}
.lvl .dot{width:1.5em;height:1.5em;border-radius:50%;border:3px solid;display:inline-flex}
.lvl .tm{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* ---------- the screen: type scale lives here so one --fit number can shrink a crowded screen ---------- */
.screen{--f:var(--fit,1);
  --t-big:clamp(38px,calc(var(--u)*7.2*var(--f)),190px);
  --t-cue:clamp(26px,calc(var(--u)*4.2*var(--f)),104px);
  --t-msg:clamp(19px,calc(var(--u)*3.1*var(--f)),76px);
  --t-sub:clamp(18px,calc(var(--u)*2.55*var(--f)),62px);
  --t-lab:clamp(15px,calc(var(--u)*1.9*var(--f)),46px);
  --g:clamp(12px,calc(var(--u)*2*var(--f)),52px);
  width:min(100%,calc(var(--u)*94))}
.cue{font-family:var(--lexend);font-weight:600;font-size:var(--t-cue);line-height:1.16;text-wrap:balance;margin:0}
.cue.big{font-size:var(--t-big);line-height:1.04;font-weight:700}
.cue.mid{font-size:calc(var(--t-cue)*.82)}
.cue.pt{font-size:calc(var(--t-cue)*1.24);line-height:1.12}
.cue.q{font-size:calc(var(--t-cue)*.8)}
.sub{font-size:var(--t-sub);color:var(--muted);margin:0;text-wrap:pretty;line-height:1.4;max-width:34em}
.sub b,.why b,.bubble b,.note b,.step b,.opt b{font-weight:700;color:var(--ink)}
.k{color:var(--actink);font-weight:700}
.eyebrow{font-family:var(--lexend);font-weight:600;color:var(--actink);font-size:var(--t-lab);letter-spacing:.02em;margin:0}
.stack{display:flex;flex-direction:column;gap:var(--g)}
.stack.tight{gap:calc(var(--g)*.55)}
.row{display:flex;gap:var(--g);align-items:flex-end}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:calc(var(--g)*1.6);align-items:center}
.split.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.split.artleft{grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr)}
.art{display:flex;justify-content:center;align-items:center}
.art>svg{width:100%;height:auto;max-height:calc(var(--u)*40*var(--f))}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--actbg)}100%{box-shadow:0 0 0 .7em rgba(255,255,255,0)}}

/* ---------- people, bubbles, notes ---------- */
.avatar{flex:0 0 auto;width:clamp(70px,calc(var(--u)*11*var(--f)),240px)}
.avatar.sm{width:clamp(56px,calc(var(--u)*8*var(--f)),170px)}
.avatar svg{width:100%;height:auto}
.bubble{position:relative;flex:1 1 0;min-width:0;background:var(--soft);border:2px solid var(--line);border-radius:calc(var(--t-msg)*.7);padding:calc(var(--t-msg)*.55) calc(var(--t-msg)*.8);font-size:var(--t-msg);line-height:1.5;max-width:32em}
.bubble::after{content:"";position:absolute;left:calc(var(--t-msg)*-.36);bottom:calc(var(--t-msg)*.9);width:calc(var(--t-msg)*.62);height:calc(var(--t-msg)*.62);background:var(--soft);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .meta{font-family:var(--lexend);font-weight:600;font-size:var(--t-lab);color:var(--muted);margin:0 0 .35em;line-height:1.25}
.bubble p{margin:0}
.bubble p+p{margin-top:.5em}
.cloud{position:relative;flex:1 1 0;min-width:0;background:var(--actbg);color:var(--actink);border-radius:calc(var(--t-msg)*1.3);padding:calc(var(--t-msg)*.55) calc(var(--t-msg)*.9);font-family:var(--lexend);font-weight:600;font-size:var(--t-msg);line-height:1.3;max-width:26em}
.cloud::before,.cloud::after{content:"";position:absolute;background:var(--actbg);border-radius:50%}
.cloud::before{width:.8em;height:.8em;left:-.1em;bottom:-.4em}
.cloud::after{width:.42em;height:.42em;left:-.7em;bottom:-.9em}
.notes{display:flex;gap:calc(var(--g)*1.4);flex-wrap:wrap;align-items:flex-start}
.note{flex:1 1 0;min-width:min(100%,9em);background:#FFF1BF;border-radius:6px;padding:calc(var(--t-msg)*.6) calc(var(--t-msg)*.7) calc(var(--t-msg)*.9);font-size:var(--t-msg);line-height:1.35;box-shadow:0 .25em 0 rgba(30,34,48,.08);transform:rotate(-1.6deg);position:relative}
.note.b{background:var(--c-bg);transform:rotate(1.4deg)}
.note .nlab{display:block;font-family:var(--lexend);font-weight:600;font-size:var(--t-lab);color:var(--muted);margin-bottom:.35em}
.card{background:var(--soft);border:2px solid var(--line);border-radius:calc(var(--t-msg)*.7);padding:calc(var(--t-msg)*.6) calc(var(--t-msg)*.85)}
.card.tint{background:var(--actbg);border-color:var(--actbg);color:var(--actink)}
.sentence{font-size:calc(var(--t-msg)*1.12);line-height:1.45;margin:0;text-wrap:pretty}
.company{display:inline-flex;align-items:center;gap:.6em;border:2px solid var(--line);border-radius:.8em;padding:.35em .8em;font-family:var(--lexend);font-weight:600;font-size:var(--t-lab);align-self:flex-start}
.company svg{width:1.7em;height:1.7em}

/* ---------- words inside a sentence that switch on ---------- */
j-w,t-w,w-w{font-weight:700;transition:color .35s}
j-w{color:var(--j-ink)} t-w{color:var(--x-ink)} w-w{color:var(--w-ink)}
:is(j-w,t-w,w-w).off{color:inherit;font-weight:inherit}
p-m{display:inline-flex;align-items:center;justify-content:center;width:1.12em;height:1.12em;border-radius:50%;background:var(--p-bg);box-shadow:inset 0 0 0 .07em var(--p-edge);vertical-align:-.18em;margin:0 .12em 0 .08em;transition:background .35s,box-shadow .35s}
p-m .lit{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
p-m .gl{display:inline-flex;width:62%;height:62%}
p-m .gl svg{width:100%;height:100%}
p-m.off{display:inline;width:auto;height:auto;background:none;box-shadow:none;margin:0;vertical-align:baseline}
p-m.off .lit{position:static;width:auto;height:auto;clip-path:none}
p-m.off .gl{display:none}
.squig{text-decoration:underline wavy var(--pink-ink);text-decoration-thickness:.08em;text-underline-offset:.22em}
.strike{text-decoration:line-through;text-decoration-thickness:.09em;opacity:.55}

/* ---------- blocks ---------- */
.tiles{display:flex;flex-wrap:wrap;align-items:flex-end;gap:calc(var(--t-msg)*.38) calc(var(--t-msg)*.3)}
.tile{display:inline-flex;flex-direction:column;gap:.12em;min-width:0;max-width:100%;border:.1em solid transparent;border-radius:calc(var(--t-msg)*.5);padding:calc(var(--t-msg)*.3) calc(var(--t-msg)*.5) calc(var(--t-msg)*.36);font-size:var(--t-msg);line-height:1.25;transition:background .4s,border-color .4s,opacity .4s}
.tile .lab{font-family:var(--lexend);font-weight:600;font-size:var(--t-lab);line-height:1.15;transition:opacity .4s}
.tile .txt b{font-weight:700}
.tC{background:var(--c-bg);border-color:var(--c-ink)} .tC .lab{color:var(--c-ink)}
.tW{background:var(--w-bg);border-color:var(--w-ink);border-style:dashed} .tW .lab,.tW .txt b{color:var(--w-ink)}
.tJ{background:var(--j-bg);border-color:var(--j-ink);border-radius:999px;padding-inline:calc(var(--t-msg)*.7)} .tJ .lab{color:var(--j-ink)} .tJ .txt{font-weight:700}
.tX{background:var(--x-bg);border-color:var(--x-ink);border-radius:999px;border-style:dotted;padding-inline:calc(var(--t-msg)*.7)} .tX .lab{color:var(--x-ink)} .tX .txt{font-weight:700}
.tS{background:var(--paper);border-color:var(--c-ink)} .tS .lab{color:var(--c-ink)}
.tV{background:var(--c-bg);border-color:var(--c-ink)} .tV .lab{color:var(--c-ink)}
.tN{padding-inline:calc(var(--t-msg)*.1)}
.tH{border:.1em dashed var(--pink-ink);background:var(--pink-bg);border-radius:999px;padding-inline:calc(var(--t-msg)*.7)} .tH .lab{color:var(--pink-ink)} .tH .txt{font-weight:700;color:var(--pink-ink)}
.tP{width:1.75em;height:1.75em;flex:0 0 auto;border-radius:50%;padding:0;background:var(--p-bg);border-color:var(--p-edge);align-items:center;justify-content:center;margin-bottom:.12em}
.tP .lit{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.tP .gl{display:flex;width:58%;height:58%}
.tP .gl svg{width:100%;height:100%}
.tile.off{background:transparent;border-color:transparent}
.tile.off .lab{opacity:0}
.tP.off .gl{opacity:.0}
.tP.off .lit{position:static;width:auto;height:auto;clip-path:none;font-size:1.1em}
.tile.joinR{border-top-right-radius:0;border-bottom-right-radius:0;border-right-color:transparent;margin-right:calc(var(--t-msg)*-.3);padding-right:calc(var(--t-msg)*.2)}
.tile.joinL{border-top-left-radius:0;border-bottom-left-radius:0;border-left-color:transparent;padding-left:calc(var(--t-msg)*.2)}
.tile.joinL .lab{visibility:hidden}
.tile.cover .txt{position:relative;color:transparent}
.tile.cover{background:var(--ink);border-color:var(--ink)} .tile.cover .lab{color:#fff;opacity:1}
.tile.ok,.tile.bad{position:relative}
.badge{display:inline-flex;align-items:center;gap:.35em;font-family:var(--lexend);font-weight:700;font-size:var(--t-lab);border-radius:999px;padding:.2em .7em;border:.12em solid;background:var(--paper);line-height:1.2}
.badge.ok{color:var(--j-ink);border-color:var(--j-ink)}
.badge.no{color:var(--pink-ink);border-color:var(--pink-ink);border-style:dashed}
.badge svg{width:1em;height:1em}
.recipe{display:flex;flex-wrap:wrap;align-items:center;gap:calc(var(--t-msg)*.3)}
.recipe .tile{font-family:var(--lexend);font-weight:600;font-size:calc(var(--t-msg)*.92)}
.recipe .tP{margin-bottom:0}
.recipe.sm .tile{font-size:calc(var(--t-msg)*.72)}
.rlabel{font-family:var(--lexend);font-weight:700;font-size:var(--t-sub);margin:0}
.rcard{display:flex;flex-direction:column;gap:calc(var(--g)*.4);border:.12em solid var(--line);border-radius:calc(var(--t-msg)*.6);padding:calc(var(--t-msg)*.45) calc(var(--t-msg)*.6);transition:opacity .35s}
.rcards{display:flex;flex-direction:column;gap:calc(var(--g)*.5)}
.dim{opacity:.4}
.seq>*{transition:opacity .35s}

/* ---------- play ---------- */
.choices{display:flex;gap:calc(var(--g)*.7);flex-wrap:wrap}
.choice{border:.12em solid var(--line);background:var(--paper);border-radius:calc(var(--t-sub)*.6);padding:.45em 1em;cursor:pointer;font-family:var(--lexend);font-weight:600;font-size:var(--t-sub);display:inline-flex;align-items:center;gap:.5em;line-height:1.2;transition:transform .15s,opacity .3s,background .3s}
.choice:hover:not([disabled]){background:var(--soft);transform:translateY(-2px)}
.choice[disabled]{cursor:default}
.choice.right{background:var(--actbg);border-color:var(--actink);color:var(--actink)}
.choice.wrong,.choice.faded{opacity:.42}
.choice .ico{display:inline-flex;width:1.1em;height:1.1em}
.choice .ico svg{width:100%;height:100%}
.choice .mk{display:inline-flex;width:1.5em;height:1.5em;border-radius:50%;background:var(--p-bg);box-shadow:inset 0 0 0 .09em var(--p-edge);align-items:center;justify-content:center}
.choice .mk svg{width:58%;height:58%}
.choice .glyph{display:inline-flex;gap:.16em;align-items:center}
.choice .glyph i{width:.72em;height:.72em;border-radius:.16em;background:var(--c-bg);border:.09em solid var(--c-ink);display:block}
.choice .glyph i.w{background:var(--w-bg);border:.09em dashed var(--w-ink)}
.opts{display:flex;flex-direction:column;gap:calc(var(--g)*.5)}
.opt{display:flex;gap:.7em;align-items:baseline;width:100%;text-align:left;border:.1em solid var(--line);background:var(--paper);border-radius:calc(var(--t-msg)*.5);padding:.42em .8em;font-family:var(--body);font-size:var(--t-msg);line-height:1.4;color:var(--ink);transition:opacity .35s,background .3s,transform .15s}
.opt:disabled{color:var(--ink)}
.opt:not(:disabled){cursor:pointer}
.opt:not(:disabled):hover{background:var(--soft);transform:translateX(4px)}
.opt .ltr{font-family:var(--lexend);font-weight:700;color:var(--actink);flex:0 0 auto}
.opt.right{background:var(--actbg);border-color:var(--actink)}
.opt.wrong,.opt.faded{opacity:.42}
.hands{font-family:var(--lexend);font-weight:600;font-size:var(--t-lab);color:var(--actink);margin:0}
.reveal{border-top:.2em solid var(--actbg);padding-top:calc(var(--g)*.6);display:flex;flex-direction:column;gap:.3em}
.verdict{font-family:var(--lexend);font-weight:700;font-size:var(--t-sub);color:var(--actink);margin:0;display:flex;align-items:center;gap:.4em}
.verdict svg{width:1.1em;height:1.1em;flex:0 0 auto}
.why{font-size:var(--t-sub);line-height:1.4;margin:0;max-width:36em}
.why p{margin:0}
.why p+p{margin-top:.3em}
.nudge{font-family:var(--lexend);font-weight:600;font-size:var(--t-lab);color:var(--muted);margin:0;min-height:1.3em}
.slot{display:inline-flex;width:1.3em;height:1.3em;border:.1em dashed var(--actink);border-radius:50%;vertical-align:-.28em;margin:0 .2em;align-items:center;justify-content:center;background:var(--paper);transition:all .35s;animation:pulse 1.6s infinite}
.slot.filled{border-style:solid;border-color:var(--p-edge);background:var(--p-bg);animation:none}
.slot.filled svg{width:58%;height:58%}
.slot.closed{width:0;border-width:0;margin:0 -.06em;animation:none;opacity:0}
.blank{display:inline-block;min-width:3.2em;border-bottom:.12em dashed var(--actink);text-align:center;font-weight:700;color:var(--actink);line-height:1.1}
.gapline{font-size:calc(var(--t-msg)*1.12);line-height:1.3;margin:0;display:flex;flex-wrap:wrap;align-items:center;row-gap:.5em}
.gapline .w{white-space:nowrap}
.gapline .wg{display:inline-flex;align-items:center;white-space:nowrap}
.gap{appearance:none;border:0;background:none;width:.86em;height:1.7em;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;border-radius:.4em;position:relative;flex:0 0 auto}
.gap::before{content:"";width:.24em;height:.24em;border-radius:50%;background:#C6C2D6;transition:transform .15s,background .15s}
.gap:hover::before,.gap.hot::before,.gap:focus-visible::before{background:var(--actink);transform:scale(2)}
.gap.filled{width:auto;cursor:default;margin:0 .2em 0 .06em}
.gap.filled::before{display:none}
.gap.filled .chip{animation:pop .3s ease}
.gap.shake::before{background:var(--pink-ink)}
.gap.shake{animation:shake .35s}
.gap[disabled]:not(.filled){cursor:default}
.chip{display:inline-flex;width:1.2em;height:1.2em;border-radius:50%;background:var(--p-bg);box-shadow:inset 0 0 0 .08em var(--p-edge);align-items:center;justify-content:center}
.chip svg{width:60%;height:60%}
.tray{display:flex;gap:calc(var(--g)*1.1);align-items:center;flex-wrap:wrap}
.traymarks{display:flex;gap:calc(var(--g)*.7)}
.mtile{appearance:none;width:2.3em;height:2.3em;border-radius:50%;background:var(--p-bg);border:.1em solid var(--p-edge);display:inline-flex;align-items:center;justify-content:center;font-size:var(--t-msg);cursor:grab;touch-action:none;padding:0;transition:opacity .3s,transform .2s;flex:0 0 auto}
.mtile svg{width:52%;height:52%;pointer-events:none}
.mtile.active{animation:bob 1.4s ease-in-out infinite;box-shadow:0 0 0 .22em var(--actbg)}
.mtile.used{opacity:.25;cursor:default;animation:none;box-shadow:none}
.mtile.wait{opacity:.5;cursor:default}
.mtile.ghost{position:fixed;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);z-index:50;animation:none;box-shadow:0 .3em .8em rgba(30,34,48,.25);margin:0}
.trayhint{font-family:var(--lexend);font-weight:600;font-size:var(--t-sub);margin:0}
.trayhint small{display:block;font-size:var(--t-lab);font-weight:500;color:var(--muted)}

/* ---------- lists that arrive one at a time ---------- */
.steps{display:flex;flex-direction:column;gap:calc(var(--g)*.6)}
.step{font-family:var(--lexend);font-weight:600;font-size:calc(var(--t-cue)*.74);line-height:1.22;display:flex;gap:.55em;align-items:flex-start;text-wrap:pretty}
.step .n{color:var(--actink);font-variant-numeric:tabular-nums;flex:0 0 auto}
.step .ico{flex:0 0 auto;width:1.25em;height:1.25em;color:var(--actink);margin-top:.02em}
.step .ico svg{width:100%;height:100%}
.step .ex{display:block;font-family:var(--body);font-weight:400;font-size:.82em;line-height:1.4;margin-top:.15em}
.chips{display:flex;flex-wrap:wrap;gap:calc(var(--g)*.5)}
.wchip{font-family:var(--lexend);font-weight:700;font-size:var(--t-sub);border-radius:999px;padding:.25em .8em;line-height:1.2}
.wgroups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(var(--g)*.7)}
.wgroup{border-radius:calc(var(--t-msg)*.6);padding:calc(var(--t-msg)*.5);background:var(--w-bg);border:.12em dashed var(--w-ink);display:flex;flex-direction:column;gap:.35em;transition:opacity .35s}
.wgroup .gl{font-family:var(--lexend);font-weight:600;font-size:var(--t-lab);color:var(--w-ink);line-height:1.2}
.wgroup .gw{font-family:var(--lexend);font-weight:700;font-size:var(--t-sub);line-height:1.25}
.wgroup.x{background:var(--x-bg);border:.12em dotted var(--x-ink)} .wgroup.x .gl{color:var(--x-ink)}
.fan{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:calc(var(--g)*.5)}
.fan .f{display:flex;flex-direction:column;align-items:center;gap:.1em;background:var(--j-bg);border:.12em solid var(--j-ink);border-radius:calc(var(--t-msg)*.6);padding:.35em .2em .5em;transition:opacity .35s}
.fan .f b{font-family:var(--lexend);font-weight:700;font-size:calc(var(--t-big)*.72);line-height:1;color:var(--j-ink)}
.fan .f span{font-family:var(--lexend);font-weight:600;font-size:var(--t-sub)}
.rhythm{display:flex;gap:calc(var(--u)*1);align-items:center;height:calc(var(--t-msg)*.9);width:100%}
.rhythm i{display:block;height:100%;border-radius:999px;background:var(--actink);position:relative;min-width:.5em}
.rhythm i.j::after{content:"";position:absolute;left:var(--at,50%);top:-25%;height:150%;width:calc(var(--u)*.5);background:var(--paper)}
.rlines{display:flex;flex-direction:column;gap:calc(var(--g)*.9)}
.rline{display:grid;grid-template-columns:auto 1fr;gap:calc(var(--g)*.8);align-items:center}
.rline .rl{font-family:var(--lexend);font-weight:700;font-size:var(--t-sub);white-space:nowrap}
.daymap{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:calc(var(--g)*.5)}
.stop{display:flex;flex-direction:column;gap:.3em;align-items:flex-start;border-radius:calc(var(--t-msg)*.5);padding:calc(var(--t-msg)*.4);border:.14em solid}
.stop .tm{font-family:var(--lexend);font-weight:700;font-size:var(--t-lab);font-variant-numeric:tabular-nums}
.stop .nm{font-family:var(--lexend);font-weight:600;font-size:var(--t-lab);line-height:1.2;color:var(--ink)}
.stop svg{width:calc(var(--t-msg)*1.7);height:auto}
.stars{display:flex;gap:.25em;flex-wrap:wrap;color:var(--actink)}
.stars svg{width:calc(var(--t-cue)*.95);height:calc(var(--t-cue)*.95)}
.round{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:calc(var(--g)*1.5);align-items:center}
.clock{width:min(100%,calc(var(--u)*30*var(--f)));justify-self:center}
.email{background:var(--soft);border:2px solid var(--line);border-radius:calc(var(--t-msg)*.6);padding:calc(var(--t-msg)*.5) calc(var(--t-msg)*.8)}
.email .hd{font-family:var(--lexend);font-weight:600;font-size:var(--t-lab);color:var(--muted);border-bottom:2px solid var(--line);padding-bottom:.35em;margin:0 0 .45em}

.email li .num{font-family:var(--lexend);font-weight:700;color:var(--actink);font-size:.9em;font-variant-numeric:tabular-nums}
.email .gr{font-size:calc(var(--t-msg)*.84);margin:0 0 .3em}
.email .sig{font-size:calc(var(--t-msg)*.84);margin:.4em 0 0}
.stamp{display:inline-block;font-family:var(--lexend);font-weight:700;font-size:var(--t-cue);letter-spacing:.1em;border:.09em solid var(--actink);color:var(--actink);border-radius:.25em;padding:.05em .4em;transform:rotate(-5deg);animation:stampin .35s cubic-bezier(.2,1.4,.4,1);align-self:flex-start}

.fly{animation:fly 1.1s ease-in forwards}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--g)}
.scorecard{display:flex;flex-direction:column;gap:.1em}
.scorecard .big{font-family:var(--lexend);font-weight:700;font-size:var(--t-big);line-height:1}

/* ---------- title ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:calc(var(--g)*1.5);align-items:center}
.hero h1{font-family:var(--lexend);font-weight:700;font-size:calc(var(--t-big)*1.12);line-height:1;margin:0;letter-spacing:-.01em}
.hero h1 span{display:block}
.herobtns{display:flex;gap:calc(var(--g)*.6);flex-wrap:wrap;align-items:center}
.keys{font-size:var(--t-lab);color:var(--muted);margin:0;font-family:var(--lexend);font-weight:500}
.kbd{display:inline-block;border:2px solid var(--line);border-bottom-width:4px;border-radius:.4em;padding:0 .45em;font-family:var(--lexend);font-weight:600;color:var(--ink);line-height:1.5}
.marks3 .m{transform-box:fill-box;transform-origin:center;animation:bob 3.2s ease-in-out infinite}
.marks3 .m2{animation-delay:.5s}.marks3 .m3{animation-delay:1s}

/* ---------- narrow screens: stack and scroll ---------- */

  .split,.split.even,.split.artleft,.round,.hero,.two{grid-template-columns:minmax(0,1fr)}

}

.tile.strike .txt{text-decoration:line-through;opacity:.5}

.rcard .rlabel{display:flex;align-items:center;gap:.5em}

.rcard .rlabel .glyph i.w{background:var(--w-bg);border:.09em dashed var(--w-ink)}
.sendrow{display:flex;align-items:center;gap:var(--g);min-height:calc(var(--t-cue)*1.5)}
.sendrow p{margin:0}
.planewrap{width:calc(var(--t-cue)*1.5);flex:0 0 auto}

.lvres{display:flex;flex-direction:column;gap:calc(var(--g)*.4)}
.mcap:empty{display:none}
.mz{min-height:calc(var(--t-msg)*2.6)}
@media (max-width:820px){.rcards.four{grid-template-columns:minmax(0,1fr)}}

/* ---------- nothing jumps: things that arrive later keep their place ---------- */
.hid{visibility:hidden!important;pointer-events:none!important;animation:none!important}
.swapbox{display:grid}
.swapbox>*{grid-area:1/1;align-self:start;min-width:0}
.swapbox>p{margin:0}
.tg{display:inline-flex;align-items:flex-end;gap:calc(var(--t-msg)*.3);min-width:0;max-width:100%}

.mcap .badge{align-self:flex-start}
.mcap p{margin:0}
.choices.four{gap:calc(var(--g)*.45)}

.num{font-family:var(--lexend);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}

.nb{white-space:nowrap}

<script>
(function(){
'use strict';
/* ---------- the marks, drawn once so they look the same on every computer ---------- */
const MARKNAME={',':'comma',';':'semicolon','.':'period'};
function markSVG(ch){
  let d='';
  if(ch==='.') d='<circle cx="50" cy="56" r="21"/>';
  else if(ch===',') d='<circle cx="52" cy="36" r="21"/><path d="M73 37 C74 62 60 82 33 94 C45 80 51 67 50 55 Z"/>';
  else if(ch===';') d='<circle cx="50" cy="20" r="15.5"/><circle cx="51" cy="60" r="15.5"/><path d="M66.5 60 C67.5 78 57 91 37 99 C46 89 50.5 80 50 71 Z"/>';
  return '<svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">'+d+'</svg>';
}

/* ---------- small line icons ---------- */
const ICON=(function(){

/* ---------- people ---------- */
function face(o){
  const skin=o.skin, hair=o.hair, shirt=o.shirt, ink='#1E2230';
  let s='<svg viewBox="0 0 120 120" role="img" aria-label="'+o.label+'">';
  if(o.longHair) s+='<path d="M27 52 Q27 16 60 16 Q93 16 93 52 L96 104 L24 104 Z" fill="'+hair+'"/>';
  s+='<path d="M14 120 Q14 86 60 86 Q106 86 106 120 Z" fill="'+shirt+'"/>';

  s+='<circle cx="60" cy="52" r="30" fill="'+skin+'"/>';
  if(o.style==='bob') s+='<path d="M28 56 Q28 18 60 18 Q92 18 92 56 L92 66 Q90 44 60 42 Q30 44 28 66 Z" fill="'+hair+'"/>';
  if(o.style==='curly') s+='<g fill="'+hair+'"><circle cx="34" cy="38" r="11"/><circle cx="46" cy="27" r="12"/><circle cx="60" cy="22" r="13"/><circle cx="74" cy="27" r="12"/><circle cx="86" cy="38" r="11"/><circle cx="30" cy="50" r="8"/><circle cx="90" cy="50" r="8"/></g>';
  if(o.style==='short') s+='<path d="M30 46 Q32 20 60 20 Q88 20 90 46 Q76 34 60 35 Q44 34 30 46 Z" fill="'+hair+'"/>';
  if(o.style==='bangs') s+='<path d="M29 48 Q34 20 60 20 Q86 20 91 48 Q78 30 62 34 Q46 30 29 48 Z" fill="'+hair+'"/>';

  if(state.i>0){ try{ localStorage.setItem('sis_save',JSON.stringify({i:state.i,scores:state.scores,names:state.names,res:state.res})); }catch(e){} }
}
function mountMarks(root){ $$('p-m',root).forEach(el=>{ if(el.firstElementChild) return; const ch=el.textContent.trim(); el.innerHTML='<span class="lit">'+ch+'</span><span class="gl" aria-hidden="true">'+markSVG(ch)+'</span>'; el.before('\u2060'); }); }
const reserves=(el)=>!!(el.parentNode&&el.parentNode.classList&&el.parentNode.classList.contains('swapbox'))||(!el.dataset.off&&!el.hasAttribute('data-collapse'));
const isShown=(el)=>!isHid(el)&&!el.classList.contains('hid');
function setShown(el,show){ if(reserves(el)) el.classList.toggle('hid',!show); else setHid(el,!show); }
function applyStep(n,quiet){
  $$('[data-s]',screenEl).forEach(el=>{ const at=+el.dataset.s, off=el.dataset.off?+el.dataset.off:1e9, show=n>=at&&n<off, was=isShown(el);
    setShown(el,show); if(show&&!was&&!quiet){ el.classList.remove('fade'); void el.getBoundingClientRect(); el.classList.add('fade'); } });
  $$('[data-off]:not([data-s])',screenEl).forEach(el=>setShown(el,n<+el.dataset.off));
  $$('[data-on]',screenEl).forEach(el=>el.classList.toggle('off',n<+el.dataset.on));
  $$('[data-add]',screenEl).forEach(el=>el.dataset.add.split(' ').forEach(p=>{ const a=p.split(':'); el.classList.toggle(a[1],n>=+a[0]); }));
  $$('.seq',screenEl).forEach(seq=>{ const items=$$(':scope > [data-s]',seq), all=seq.dataset.all?+seq.dataset.all:1e9; let cur=-1;
    items.forEach(el=>{ const at=+el.dataset.s; if(at<=n&&at>cur) cur=at; });
    items.forEach(el=>el.classList.toggle('dim',n<all&&+el.dataset.s<cur)); });
}
function wireSteps(s){ let max=0;
  $$('[data-s],[data-on],[data-off],[data-add]',screenEl).forEach(el=>{ ['s','on','off'].forEach(k=>{ if(el.dataset[k]) max=Math.max(max,+el.dataset[k]); }); if(el.dataset.add) el.dataset.add.split(' ').forEach(p=>{ max=Math.max(max,+p.split(':')[0]); }); });
  $$('.seq[data-all]',screenEl).forEach(el=>{ max=Math.max(max,+el.dataset.all); });
  s._max=max; applyStep(0,true);
  if(max>0){
    s.advance=()=>{ if(state.step>=s._max) return false; state.step++; applyStep(state.step,false); sfx.pop(); snapshot(); fit(); return true; };
    s.state=(n)=>{ state.step=Math.max(0,Math.min(n,s._max)); applyStep(state.step,true); };
  }
}
let fitMin=1;
function fit(reset){
  if(reset) fitMin=1;
  if(window.innerWidth<=820){ screenEl.style.removeProperty('--fit'); if(current&&current.onfit) current.onfit(); return; }
  const hid=$$('[hidden]',screenEl); hid.forEach(el=>setHid(el,false));
  const ca=getComputedStyle(appEl), cs=getComputedStyle(stageEl);
  const avail=rootEl.clientHeight-topEl.offsetHeight-bottomEl.offsetHeight-parseFloat(ca.paddingTop)-parseFloat(ca.paddingBottom)-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-14;
  let f=fitMin, guard=0; screenEl.style.setProperty('--fit',f); if(current&&current.onfit) current.onfit();
  while(f>0.58&&screenEl.offsetHeight>avail&&guard++<14){ f=Math.round((f-0.04)*100)/100; screenEl.style.setProperty('--fit',f); if(current&&current.onfit) current.onfit(); }
  fitMin=f; hid.forEach(el=>setHid(el,true));
}
function buildProgress(){ barEl.innerHTML=ACT_ORDER.map(k=>{ const n=S.filter(x=>x.act===k).length; return '<div class="seg" style="flex-grow:'+n+';background:'+ACTS[k].bg+'"><i style="background:'+ACTS[k].ink+'"></i></div>'; }).join(''); }
function paintNav(){ backBtnEl.disabled=state.i===0; nextBtnEl.disabled=state.i===S.length-1&&!(current&&current._max>state.step&&state.step<99); }
function paintProgress(){ let start=0; ACT_ORDER.forEach((k,idx)=>{ const n=S.filter(x=>x.act===k).length; const done=Math.max(0,Math.min(n,state.i+1-start)); barEl.children[idx].firstElementChild.style.width=(done/n*100)+'%'; start+=n; });
  countEl.textContent=(state.i+1)+' / '+S.length; paintNav(); }
function render(restoreStep){
  if(current&&current.cleanup) current.cleanup();
  stopSpeech(); closeMore();
  const s=S[state.i]; current=s; const a=ACTS[s.act];
  rootEl.style.setProperty('--actbg',a.bg); rootEl.style.setProperty('--actink',a.ink);
  badgeEl.textContent=a.name;
  screenEl.innerHTML=s.html; mountMarks(screenEl);
  s.advance=null; s.state=null; s.cleanup=null; s.onfit=null;
  wireSteps(s);
  $$('[data-next]',screenEl).forEach(b=>b.addEventListener('click',()=>next()));
  if(s.init) s.init.call(s,screenEl);
  if(restoreStep&&s.state) s.state(restoreStep);
  paintProgress(); fit(true); window.scrollTo(0,0);
}
function next(){ if(current&&current.advance&&current.advance()){ paintNav(); return; } if(state.i<S.length-1){ state.i++; state.step=0; render(); snapshot(); } }
function back(){ if(state.i>0){ state.i--; state.step=0; render(); snapshot(); } }
function go(i){ state.i=Math.max(0,Math.min(S.length-1,i)); state.step=0; render(); snapshot(); }
nextBtnEl.addEventListener('click',next);
backBtnEl.addEventListener('click',back);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeLevels(); closeMore(); return; }
  if(!isHid($('#levels'))) return;
  if(e.target.isContentEditable||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); next(); }
  if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); back(); }
});
let rz=null; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>fit(true),120); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>fit(true));

/* ---------- scoreboard ---------- */
function paintScores(){ $('#ptsA').textContent=state.scores.A; $('#ptsB').textContent=state.scores.B; const nm=$$('.team .name'); nm[0].textContent=state.names.A; nm[1].textContent=state.names.B; }
$$('.pm').forEach(b=>b.addEventListener('click',()=>{ const t=b.dataset.t; state.scores[t]=Math.max(0,state.scores[t]+(+b.dataset.d)); $('#pts'+t).textContent=state.scores[t]; if(+b.dataset.d>0) sfx.pop(); snapshot(); }));
$$('.team .name').forEach((el,k)=>{ el.addEventListener('input',()=>{ state.names[k?'B':'A']=el.textContent.trim().slice(0,20)||(k?'Right':'Left'); snapshot(); }); el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } }); });

/* ---------- listen ---------- */
const synth=window.speechSynthesis; let voices=[];
const listenBtn=$('#listenBtn'), voiceSel=$('#voiceSel'), morePop=$('#morePop'), moreBtn=$('#moreBtn'), soundBtn=$('#soundBtn');
function collectSay(){ const parts=[];
  (function walk(n){ if(n.nodeType===3){ const t=n.nodeValue.replace(/\s+/g,' '); if(t.trim()) parts.push(t); return; } if(n.nodeType!==1) return;
    if(isHid(n)||n.getAttribute('aria-hidden')==='true'||(n.classList&&(n.classList.contains('nosay')||n.classList.contains('hid')))||n.tagName.toLowerCase()==='svg') return;
    const blk=/^(DIV|P|H1|H2|LI|BUTTON|OL|UL)$/.test(n.tagName); n.childNodes.forEach(walk); if(blk) parts.push('. '); })(screenEl);
  return parts.join('').replace(/·/g,',').replace(/\s+([.,;:?!])/g,'$1').replace(/([.?!;:,])\s*\.(?=\s|$)/g,'$1').replace(/\s+/g,' ').trim(); }
function loadVoices(){ if(!synth) return; voices=synth.getVoices().filter(v=>/^en/i.test(v.lang)); if(!voices.length) voices=synth.getVoices();
  voiceSel.innerHTML=voices.map((v,i)=>'<option value="'+i+'">'+v.name+' ('+v.lang+')</option>').join(''); const want=voices.findIndex(v=>v.name===state.voice);
  voiceSel.value=want>=0?want:Math.max(0,voices.findIndex(v=>/samantha|google us english|aria|jenny|zira/i.test(v.name))); }
if(synth){ loadVoices(); synth.onvoiceschanged=loadVoices; } else { listenBtn.disabled=true; listenBtn.textContent='No speech here'; }
function stopSpeech(){ if(synth) synth.cancel(); listenBtn.setAttribute('aria-pressed','false'); listenBtn.textContent='🔊 Listen'; }
listenBtn.addEventListener('click',()=>{ if(!synth) return; if(synth.speaking){ stopSpeech(); return; }
  const u=new SpeechSynthesisUtterance(current.say||collectSay()); const v=voices[+voiceSel.value]; if(v) u.voice=v; u.rate=state.rate; u.onend=stopSpeech; u.onerror=stopSpeech;
  listenBtn.setAttribute('aria-pressed','true'); listenBtn.textContent='■ Stop'; synth.speak(u); });
voiceSel.addEventListener('change',()=>{ const v=voices[+voiceSel.value]; state.voice=v?v.name:''; try{ localStorage.setItem('sis_voice',state.voice); }catch(e){} });
$$('[data-rate]',morePop).forEach(b=>b.addEventListener('click',()=>{ $$('[data-rate]',morePop).forEach(x=>x.classList.toggle('on',x===b)); state.rate=+b.dataset.rate; try{ localStorage.setItem('sis_rate',String(state.rate)); }catch(e){} }));

/* ---------- settings, sounds, full screen, new game ---------- */
function closeMore(){ setHid(morePop,true); moreBtn.setAttribute('aria-expanded','false'); }
moreBtn.addEventListener('click',()=>{ const open=isHid(morePop); setHid(morePop,!open); moreBtn.setAttribute('aria-expanded',String(open)); });
function paintSound(){ soundBtn.textContent=state.mute?'🔕 Sounds are off':'🔔 Sounds are on'; soundBtn.setAttribute('aria-pressed',String(!state.mute)); }
soundBtn.addEventListener('click',()=>{ state.mute=!state.mute; paintSound(); try{ localStorage.setItem('sis_mute',state.mute?'1':'0'); }catch(e){} if(!state.mute) sfx.pop(); });
$('#fullBtn').addEventListener('click',()=>{ const d=document.documentElement; try{ if(document.fullscreenElement){ document.exitFullscreen&&document.exitFullscreen().catch(()=>{}); } else if(d.requestFullscreen){ d.requestFullscreen().catch(()=>{}); } }catch(e){} });
function newGame(){ state.i=0; state.step=0; state.scores={A:0,B:0}; state.res={}; saved=null; try{ localStorage.removeItem('sis_save'); }catch(e){} paintScores(); closeMore(); closeLevels(); render(); snapshot(); }
let newArm=null; $('#newBtn').addEventListener('click',e=>{ const b=e.currentTarget; if(newArm){ clearTimeout(newArm); newArm=null; b.textContent='Start a new game'; newGame(); return; } b.textContent='Tap again to clear the scores'; newArm=setTimeout(()=>{ newArm=null; b.textContent='Start a new game'; },4000); });
try{ const v=localStorage.getItem('sis_voice'); if(v) state.voice=v; const r=localStorage.getItem('sis_rate'); if(r){ state.rate=+r; $$('[data-rate]',morePop).forEach(x=>x.classList.toggle('on',+x.dataset.rate===state.rate)); } if(localStorage.getItem('sis_mute')==='1') state.mute=true; }catch(e){}
paintSound();

/* ---------- levels ---------- */
const levelsEl=$('#levels'), levelList=$('#levelList');
function closeLevels(){ setHid(levelsEl,true); }
function openLevels(){ closeMore(); stopSpeech();
  levelList.innerHTML=ACT_ORDER.map(k=>{ const a=ACTS[k], first=S.findIndex(x=>x.act===k), t=tally(k); const here=S[state.i].act===k;
    return '<button class="lvl'+(here?' here':'')+'" data-go="'+first+'"><span class="dot" style="background:'+a.bg+';border-color:'+a.ink+'"></span><span>'+a.short+(t.tried?' <span class="tm">· '+t.got+' of '+t.ids.length+' first try</span>':'')+'</span><span class="tm">'+a.time+'</span></button>'; }).join('');
  $$('.lvl',levelList).forEach(b=>b.addEventListener('click',()=>{ closeLevels(); go(+b.dataset.go); }));
  setHid(levelsEl,false); const h=$('.lvl.here',levelList); if(h) h.focus(); }
$('#levelsBtn').addEventListener('click',openLevels);
$('#levelsClose').addEventListener('click',closeLevels);
levelsEl.addEventListener('click',e=>{ if(e.target===levelsEl) closeLevels(); });

/* ---------- boot ---------- */
function adopt(d){ state.i=Math.min(Math.max(0,d.i|0),S.length-1); if(d.scores) state.scores=d.scores; if(d.names) state.names=d.names; state.step=d.step||0; state.res=d.res||{}; }
function start(data){
  if(data&&typeof data.i==='number') adopt(data);
  else { try{ const raw=localStorage.getItem('sis_save'); if(raw){ const d=JSON.parse(raw); if(d&&d.i>0&&d.i<S.length) saved=d; } }catch(e){} }
  buildProgress(); paintScores(); render(state.step); snapshot();
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready){ window.claude.hot.ready(start); } else { start((window.claude&&window.claude.hot&&window.claude.hot.data)||{}); }

window.__SIS={S:S,state:state,ACTS:ACTS,go:go,next:next,back:back,tally:tally};
})();
</script>
